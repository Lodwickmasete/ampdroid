name: Android CI

on:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 11

      - name: Show project structure (debug)
        run: ls -R

      - name: Grant execute permission for gradlew
        run: chmod +x ampdroid/gradlew

      - name: Build FULL APK
        run: cd ampdroid && ./gradlew assembleFullDebug

      - name: Get version
        id: version
        run: echo "VERSION=v$(date +%Y.%m.%d.%H%M)" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.VERSION }}
          name: "Release ${{ steps.version.outputs.VERSION }}"
          overwrite_files: true
          files: |
            ampdroid/app/build/outputs/apk/full/debug/app-full-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: Android CI

on:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 11

      - name: Install Gradle 6.9
        run: |
          wget https://services.gradle.org/distributions/gradle-6.9-bin.zip
          unzip gradle-6.9-bin.zip
          echo "$PWD/gradle-6.9/bin" >> $GITHUB_PATH

      - name: Show project structure (debug)
        run: ls -R

      # =========================
      # VERSION (1.x.x FORMAT)
      # =========================
      - name: Generate version
        id: version
        run: |
          MAJOR=1
          MINOR=0
          PATCH=${{ github.run_number }}
          echo "VERSION=v$MAJOR.$MINOR.$PATCH" >> $GITHUB_OUTPUT

      # =========================
      # BASE APK (NET INSTALLER)
      # =========================
      - name: Build base APK
        run: gradle clean assembleDebug

      - name: Create setup.json (NET INSTALLER)
        run: |
          mkdir -p app/src/main/assets

          cat > app/src/main/assets/setup.json <<EOF
          {
            "net_installer": true,
            "download_url": "https://github.com/Lodwickmasete/ampdroid/releases/download/v1.0/assets.zip",
            "version": "${{ steps.version.outputs.VERSION }}"
          }
          EOF

      - name: Save base APK
        run: |
          mkdir -p output
          cp app/build/outputs/apk/debug/app-debug.apk output/ampdroid-net-installer.apk

      # =========================
      # DOWNLOAD + EXTRACT ASSETS
      # =========================
      - name: Download assets
        run: |
          wget -O assets.zip https://github.com/Lodwickmasete/ampdroid/releases/download/v1.0/assets_debug.zip

      - name: Extract assets
        run: |
          rm -rf app/src/main/assets
          mkdir -p app/src/main/assets
          unzip -o assets.zip -d app/src/main/assets

      # =========================
      # ASSETS APK (OFFLINE INSTALLER)
      # =========================
      - name: Create setup.json (OFFLINE INSTALLER)
        run: |
          mkdir -p app/src/main/assets

          cat > app/src/main/assets/setup.json <<EOF
          {
            "net_installer": false,
            "download_url": "https://github.com/Lodwickmasete/ampdroid/releases/download/v1.0/assets.zip",
            "version": "${{ steps.version.outputs.VERSION }}"
          }
          EOF

      - name: Build assets APK
        run: gradle clean assembleDebug

      - name: Save assets APK
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk output/ampdroid-offline-installer.apk

      # =========================
      # RELEASE NOTES
      # =========================
      - name: Create release notes
        run: |
          echo "## 🚀 Ampdroid Release ${{ steps.version.outputs.VERSION }}" > release_notes.md
          echo "" >> release_notes.md

          echo "### 👤 Author: Lodwick Masete" >> release_notes.md
          echo "" >> release_notes.md

          echo "### 🛠 Fixes" >> release_notes.md
          echo "- Fixed asset extraction instability (Issue #1)" >> release_notes.md
          echo "" >> release_notes.md

          echo "### 📌 Issue Closed" >> release_notes.md
          echo "- https://github.com/Lodwickmasete/ampdroid/issues/1" >> release_notes.md
          echo "  > Asset build on v1.0.88 was unstable and extraction incomplete — now fixed." >> release_notes.md
          echo "" >> release_notes.md

          echo "### 📦 Builds" >> release_notes.md
          echo "- 🟢 ampdroid-net-installer.apk (downloads assets on first run)" >> release_notes.md
          echo "- 🟡 ampdroid-offline-installer.apk (fully bundled assets)" >> release_notes.md
          echo "- 📁 assets.zip (from v1.0 release)" >> release_notes.md

      # =========================
      # GITHUB RELEASE
      # =========================
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.VERSION }}
          name: "Ampdroid ${{ steps.version.outputs.VERSION }}"
          body_path: release_notes.md
          overwrite_files: true
          files: |
            output/ampdroid-net-installer.apk
            output/ampdroid-offline-installer.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

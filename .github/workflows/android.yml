name: Android CI

on:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 11

      - name: Install Gradle 6.9
        run: |
          wget https://services.gradle.org/distributions/gradle-6.9-bin.zip
          unzip gradle-6.9-bin.zip
          echo "$PWD/gradle-6.9/bin" >> $GITHUB_PATH

      - name: Verify project structure
        run: ls -R ampdroid

      - name: Build FULL APK
        working-directory: ampdroid
        run: gradle assembleFullDebug

      - name: Get version
        id: version
        run: echo "VERSION=v$(date +%Y.%m.%d.%H%M)" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.VERSION }}
          name: "Release ${{ steps.version.outputs.VERSION }}"
          overwrite_files: true
          files: |
            ampdroid/app/build/outputs/apk/full/debug/app-full-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
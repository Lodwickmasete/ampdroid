name: Android CI

on:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 11

      - name: Install Gradle 6.9
        run: |
          wget https://services.gradle.org/distributions/gradle-6.9-bin.zip
          unzip gradle-6.9-bin.zip
          echo "$PWD/gradle-6.9/bin" >> $GITHUB_PATH

      - name: Check Gradle version
        run: gradle -v

      - name: Build APK
        working-directory: draft/php
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: draft/php/app/build/outputs/apk/debug/app-debug.apk

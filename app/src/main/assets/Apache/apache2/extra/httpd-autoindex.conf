# ============================================
# AUTOINDEX CONFIGURATION
# ============================================

# Make web assets (CSS, header, footer) accessible
Alias /ampdroid "/data/data/com.lodwickmasete.php/files/ampdroid"
<Directory "/data/data/com.lodwickmasete.php/files/ampdroid">
    Require all granted
</Directory>

# Make icons accessible
Alias /icons "/data/data/com.lodwickmasete.php/files/ampdroid/icons"
<Directory "/data/data/com.lodwickmasete.php/files/ampdroid/icons">
    Options Indexes MultiViews
    AllowOverride None
    Require all granted
</Directory>


# Main autoindex settings
IndexOptions FancyIndexing HTMLTable VersionSort FoldersFirst SuppressDescription
IndexOrderDefault Ascending Name

# Header and footer (relative to each directory, but using alias in HTML)
HeaderName /ampdroid/html/header.html
ReadmeName /ampdroid/html/footer.html


# ============================================
# ICON MAPPINGS (SVG FANCY INDEX)
# ============================================

AddIconByEncoding (CMP,/icons/fancy-index/file-zip.svg) x-compress x-gzip

AddIconByType (TXT,/icons/fancy-index/file-text.svg) text/*
AddIconByType (IMG,/icons/fancy-index/file-media.svg) image/*
AddIconByType (SND,/icons/fancy-index/file-media.svg) audio/*
AddIconByType (VID,/icons/fancy-index/file-media.svg) video/*

AddIcon /icons/fancy-index/file-binary.svg .bin .exe

AddIcon /icons/fancy-index/file-zip.svg .Z .z .tgz .gz .zip

AddIcon /icons/fancy-index/html.svg .html .htm .shtml
AddIcon /icons/fancy-index/file-pdf.svg .pdf

AddIcon /icons/fancy-index/file-text.svg .txt
AddIcon /icons/fancy-index/markdown.svg .md

AddIcon /icons/fancy-index/php.svg .php
AddIcon /icons/fancy-index/js.svg .js
AddIcon /icons/fancy-index/typescript.svg .ts
AddIcon /icons/fancy-index/python.svg .py
AddIcon /icons/fancy-index/ruby.svg .rb
AddIcon /icons/fancy-index/java.svg .java

AddIcon /icons/fancy-index/css.svg .css .scss .sass .less .styl
AddIcon /icons/fancy-index/xml.svg .xml
AddIcon /icons/fancy-index/yaml.svg .yml .yaml
AddIcon /icons/fancy-index/terminal.svg .sh .bash .zsh

AddIcon /icons/fancy-index/docker.svg Dockerfile
AddIcon /icons/fancy-index/npm.svg package.json
AddIcon /icons/fancy-index/nodejs.svg package-lock.json
AddIcon /icons/fancy-index/git.svg .gitignore

AddIcon /icons/fancy-index/database.svg .sql .mysql .sqlite .dsql .db
    

AddIcon /icons/fancy-index/settings.svg .conf .config
AddIcon /icons/fancy-index/code.svg .c .cpp .h

AddIcon /icons/fancy-index/file-directory.svg ^^DIRECTORY^^

DefaultIcon /icons/fancy-index/gear.svg

IndexIgnore .??* *~ *# HEADER* README* RCS CVS *,v *,t

AddType image/svg+xml .svg
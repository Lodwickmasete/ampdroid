extension_dir = "/data/data/com.lodwickmasete.php/files/lib/php:/data/data/com.lodwickmasete.php/files/lib/common"


; Enable some common extensions
;extension=opcache.so

; Set session save path
session.save_path = "/data/data/com.lodwickmasete.php/files/tmp"

; Set upload temp directory
upload_tmp_dir = "/data/data/com.lodwickmasete.php/files/tmp"

; Error logging
error_log = "/data/data/com.lodwickmasete.php/files/logs/php/php_errors.log"
log_errors = On

; Performance
memory_limit = 256M
max_execution_time = 300
max_input_time = 300
post_max_size = 100M
upload_max_filesize = 100M

; Display errors (for development)
display_errors = On
display_startup_errors = On

; Timezone
date.timezone = UTC

; Enable opcache
opcache.enable = On
opcache.enable_cli = On
opcache.memory_consumption = 128
opcache.max_accelerated_files = 10000
opcache.lockfile_path = "/data/data/com.lodwickmasete.php/files/tmp"